server {
    listen 80;

    # Largest valid payload is a 32 x 2000-character batch.
    client_max_body_size 128k;

    # Static frontend (the same files Vercel serves from its CDN).
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # API routes, same paths as on Vercel (same origin, no CORS needed).
    location ~ ^/(v1/|health$|ready$|docs$|openapi\.json$) {
        proxy_pass http://api:8080;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
