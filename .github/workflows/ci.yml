name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.8.4
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies (CPU-only torch)
        run: |
          pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
      - run: pytest -m "not e2e"

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies (CPU-only torch) and Chromium
        run: |
          pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Browser tests of the frontend
        env:
          E2E_REQUIRED: "1"
        run: pytest -m e2e

  runtime-footprint:
    # Guards the Vercel function size limit (500 MB, model downloaded at runtime).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m venv /tmp/rt && /tmp/rt/bin/pip install -q -r requirements.txt
      - name: Import the app without ML tooling
        run: |
          /tmp/rt/bin/python -c "import sms_fraud.main"
          if /tmp/rt/bin/python -c "import torch" 2>/dev/null; then
            echo "::error::torch must not be a runtime dependency"; exit 1
          fi
      - name: Check installed size
        run: |
          size_mb=$(du -sm /tmp/rt/lib/python3.12/site-packages | cut -f1)
          echo "Runtime dependencies: ${size_mb} MB" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$size_mb" -lt 300
