services:
  api:
    build: .
    environment:
      - SMS_FRAUD_LOG_LEVEL=INFO
    volumes:
      # Persist the ONNX artifacts so they are downloaded only once.
      - onnx-model:/home/appuser/models
    restart: unless-stopped
    networks:
      - sms-fraud-network

  web:
    build: ./interface-web
    depends_on:
      api:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
      - API_URL=/api  # relative path, routed to the API by nginx
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - sms-fraud-network

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web
    restart: unless-stopped
    networks:
      - sms-fraud-network

volumes:
  onnx-model:

networks:
  sms-fraud-network:
    driver: bridge
