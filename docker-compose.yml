services:
  api:
    build: .
    environment:
      - SMS_FRAUD_LOG_LEVEL=INFO
    volumes:
      # Persist the ONNX artifacts so they are downloaded only once.
      - onnx-model:/home/appuser/models
    restart: unless-stopped
    networks:
      - sms-fraud-network

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/usr/share/nginx/html:ro
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - sms-fraud-network

volumes:
  onnx-model:

networks:
  sms-fraud-network:
    driver: bridge
