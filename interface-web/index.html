<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Détection de Fraude SMS</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app">
        <header class="app-header">
            <h1>Détection de Fraude SMS</h1>
        </header>
        
        <main class="app-main">
            <div class="container">
                <div class="card">
                    <h2>Analyser un SMS</h2>
                    <div class="input-group">
                        <textarea 
                            id="smsInput"
                            placeholder="Entrez le message SMS à analyser..."
                            rows="4"
                        ></textarea>
                        <button class="primary-button" id="analyzeButton">
                            Analyser
                        </button>
                    </div>
                </div>

                <div class="card result-card">
                    <h2>Résultat</h2>
                    <div class="result-content">
                        <p id="resultText">En attente d'analyse...</p>
                    </div>
                </div>
            </div>
        </main>

        <footer class="app-footer">
            <p>&copy; 2024 Détection de Fraude SMS. Tous droits réservés.</p>
        </footer>
    </div>

    <script>
        const analyzeButton = document.getElementById('analyzeButton');

        analyzeButton.addEventListener('click', async () => {
            const smsText = document.getElementById('smsInput').value.trim();
            const resultText = document.getElementById('resultText');

            if (!smsText) {
                resultText.textContent = 'Veuillez entrer un message à analyser.';
                return;
            }

            analyzeButton.disabled = true;
            resultText.textContent = 'Analyse en cours...';
            try {
                const apiUrl = '${API_URL}';
                const response = await fetch(`${apiUrl}/v1/predict`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({ message: smsText })
                });

                if (!response.ok) {
                    throw new Error(`Erreur HTTP ${response.status}`);
                }

                const result = await response.json();
                const score = Math.round(result.fraud_score * 100);
                resultText.textContent = result.is_fraud
                    ? `⚠️ Fraude probable (score de fraude : ${score} %)`
                    : `✅ Message légitime (score de fraude : ${score} %)`;
            } catch (error) {
                console.error(error);
                resultText.textContent = `Une erreur est survenue : ${error.message}`;
            } finally {
                analyzeButton.disabled = false;
            }
        });
    </script>
</body>
</html>
